# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]


line-length = 120
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[lint]
select = [
    "A",  # flake8-builtins
    "E",  # pycodestyle
    "F", # Pyflakes
    "D", # Pydocstyle
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM", # flake8-simplify
    "I",  # isort
    "PL", # pylint
    "W",
    "C",
    "W391", # too-many-newlines-at-end-of-file
]
preview = true
explicit-preview-rules = true

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
ignore = ["PLR0913","PLR0912","PLR0915", "D200", "D414", "PLR2004", "D415", "D205", "D100", "D102", "PLW0603", "F841", "SIM102", "PLW0602", "PLW2901", "E722", "SIM118", "E501", "SIM115", "SIM113", "SIM108", "C901", "PLR1714", "D104", "F401", "B007"]


[lint.pydocstyle]
convention = "google"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
