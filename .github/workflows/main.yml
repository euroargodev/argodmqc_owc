# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  documentation:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies with Poetry
        run: |
          python -m pip install --upgrade pip
          pip install Poetry
          poetry install --with docs

      - name: Build documentation
        working-directory: docs
        run: poetry run sphinx-build -M html source build -W
  tests:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [3.13]
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@master

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with pip
      run: |
          python -m pip install --upgrade pip
          pip install Poetry 
          pip install distributed
          poetry install --with tests

    - name: Test with pytest
      run: |
        echo `pwd`
        ls -al
        poetry run pytest --verbosity=3 --cov=./ --cov-config=.coveragerc --cov-report xml:cov.xml --cov-report term-missing --disable-pytest-warnings

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
        file: ./cov.xml # optional
        flags: unittests # optional
        name: codecov-github # optional
        fail_ci_if_error: false # optional (default = false)

    - name: Install Dependencies for Linting with Ruff
      run: |
          python -m pip install --upgrade pip
          pip install Poetry 
          poetry install --with lint

    - name: Lint with Ruff
      run: |
        poetry run ruff check